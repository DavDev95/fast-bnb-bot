<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTCN Moon Rocket 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one narrow column — HUD, tall play field, short footer. Single dark look. */
  :root{
    color-scheme:dark;
    --orange:#F7931A; --orange2:#ffae40; --bg:#05070d; --card:#0f141d; --border:#232b3a;
    --text:#eef3fb; --muted:#93a1b5; --bad:#ff6b6b; --ink:#1a1000;
    --display:Orbitron,system-ui,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.45;
    display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}
  .app{width:100%;max-width:460px;padding-block:10px 16px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:8px}
  .app>*{flex:none}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-family:var(--display);font-size:17px;letter-spacing:.3px}
  h1 span{color:var(--orange)}
  .tools{display:flex;gap:6px}
  .chip{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:999px;
    padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
  :focus-visible{outline:2px solid var(--orange2);outline-offset:2px}
  .hud{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px 10px;min-width:0}
  .stat small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
  .stat b{font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{position:relative;height:16px;background:var(--card);border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:999px;background:linear-gradient(90deg,#ff5a1f,var(--orange2))}
  .bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:700;letter-spacing:.6px;text-shadow:0 1px 2px #000}
  .stage{position:relative;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#07090c}
  canvas{display:block;width:100%;touch-action:none;cursor:pointer}
  .overlay{position:absolute;inset:0;background:rgba(5,7,13,.88);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:18px;gap:10px;overflow:auto}
  .overlay h2{font-family:var(--display);font-size:24px;text-wrap:balance}
  .overlay h2 em{font-style:normal;color:var(--orange)}
  .overlay p{color:var(--muted);font-size:14px;max-width:320px}
  .overlay .result{color:var(--text);font-size:15px}
  .btn{background:var(--orange);color:var(--ink);border:0;border-radius:999px;padding:12px 26px;
    font-size:16px;font-weight:800;cursor:pointer}
  .btn.alt{background:transparent;color:var(--text);border:1px solid var(--border)}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .toast{position:absolute;left:10px;right:10px;top:10px;background:rgba(15,20,29,.92);text-align:center;
    border:1px solid var(--orange);border-radius:12px;padding:8px 12px;font-family:var(--display);font-size:13px;
    opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  footer{color:var(--muted);font-size:11.5px;text-align:center}
  @media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

    <h1><span>BTCN</span> Moon Rocket 3D</h1>

    $("langBtn").textContent = lang === "fr" ? "EN" : "FR";
    if(!ok3d){ $("ovText").textContent = tr("no3d"); $("playBtn").hidden = true; }
    if(state === "over"){ lastRes.a = altTxt(prog); showEnd(); } else showBest();
    hud();
  }
  $("langBtn").addEventListener("click", function(){ lang = lang === "fr" ? "en" : "fr"; put("btcn.lang", lang); applyLang(); });
  if(ok3d){ try{ build(); }catch(e){ ok3d = false; } }
  if(location.hash === "#debug") window.__rocket = { ship: ship, items: function(){ return items; }, warp: function(v){ prog = v; }, lim: function(){ return [xMax, yMin, yMax]; } };
  paintSound(); applyLang(); resize(); if(ok3d) render(0);
})();
</script>
</body>
</html>
