# Grid config for the "BTC" token 0xf22aac87E08d7FC60aA89eb21110ddfE59c20854
#
# WARNING: this is NOT the official Binance-Peg BTCB
# (which is 0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c).
# Run `python tools/inspect_token.py 0xf22aac87E08d7FC60aA89eb21110ddfE59c20854`
# on your server FIRST to confirm it is legit and to get the real price band.
#
# Start with:  python main.py -c config.btc.yaml   (dry-run, safe)

dry_run: true

# Strategy: "grid" (buy low / sell higher) or "churn" (buy then immediately
# sell back on a timer). NOTE: churn pays the ~0.5% PancakeSwap fee + gas on
# every round trip, so it loses money when the price does not rise.
mode: churn

tokens:
  base:
    address: "0xf22aac87E08d7FC60aA89eb21110ddfE59c20854"
    symbol: "BTC"
  quote:
    # Address is WBNB (needed for routing), but the bot trades with NATIVE BNB:
    # it pays BNB on buys and receives BNB on sells — no wrapping required.
    address: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c"   # WBNB (routes as BNB)
    symbol: "BNB"

grid:
  # Band from tools/inspect_token.py (WBNB per 1 BTC token), +/-15% around
  # the ~3.78e-06 price observed on 2026-06-18. Widen if the token moves more.
  lower_price: 0.00000321
  upper_price: 0.00000434
  levels: 11
  order_size_quote: 0.01  # WBNB spent per buy step — small, micro-cap token

# Churn settings — used only when mode: churn.
churn:
  trade_size_quote: 0.03   # BNB per buy (~$17). Small = low price impact = less loss.
  interval_sec: 10         # buy + sell back roughly every 10 seconds

execution:
  poll_interval_sec: 1.0
  slippage_bps: 300        # 3% — churn does big trades on a thin pool; a worse
                           # fill than this REVERTS (only gas lost) instead of
                           # executing at a bad price.
  deadline_sec: 30
  gas_price_gwei: 1        # cheapest reliable gas on BSC (lower may get stuck)
  max_gas_limit: 350000

risk:
  max_quote_exposure: 0.05  # never hold more than 0.05 WBNB of this token
  stop_below_price: null
  stop_above_price: null
